    - {side: friend, type_id: 7, type: Sentry, hp: 400, max_hp: 400}
    - {side: enemy, type_id: 1, type: Hero, hp: 350, max_hp: 350}
    - {side: enemy, type_id: 3, type: Infantry1, hp: 300, max_hp: 300}
    - {side: enemy, type_id: 7, type: Sentry, hp: 400, max_hp: 400}

layers:
